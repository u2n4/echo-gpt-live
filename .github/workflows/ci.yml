name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Race tests
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - name: Check Lambda syntax
        run: node --check lambda/index.mjs
      - name: Offline Lambda regressions
        run: node --test lambda/index.test.mjs
